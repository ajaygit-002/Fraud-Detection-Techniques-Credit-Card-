version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: fraud-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ml-model:
    build:
      context: ./ml-model
    container_name: fraud-ml
    restart: unless-stopped
    ports:
      - "8000:8000"

  server:
    build:
      context: ./server
    container_name: fraud-server
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/fraud_detection
      - ML_SERVICE_URL=http://ml-model:8000
    depends_on:
      - mongodb
      - ml-model
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
    container_name: fraud-client
    restart: unless-stopped
    environment:
      - VITE_API_BASE=http://localhost:5000/api
    depends_on:
      - server
    ports:
      - "5173:5173"

volumes:
  mongo_data:
